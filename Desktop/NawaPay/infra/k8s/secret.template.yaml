apiVersion: v1
kind: Secret
metadata:
  name: nawapay-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo:27017/nawapay"
  SQL_URI: "postgres://nawapay:change-me@postgres:5432/nawapay"
  JWT_SECRET: "replace-with-kms-managed-secret"
  ELECTRICITY_PROVIDER_API_KEY: "replace-with-electricity-provider-key"
  MTC_PROVIDER_API_KEY: "replace-with-mtc-provider-key"
  TELECOM_PROVIDER_API_KEY: "replace-with-telecom-provider-key"
  CASTLEBET_PROVIDER_API_KEY: "replace-with-castlebet-provider-key"
  JSB_PROVIDER_API_KEY: "replace-with-jsb-provider-key"
