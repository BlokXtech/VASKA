apiVersion: apps/v1
kind: Deployment
metadata:
  name: nawapay-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nawapay-api
  template:
    metadata:
      labels:
        app: nawapay-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/nawapay-api:latest
          ports:
            - containerPort: 4100
          envFrom:
            - configMapRef:
                name: nawapay-config
            - secretRef:
                name: nawapay-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4100
            initialDelaySeconds: 15
            periodSeconds: 20
