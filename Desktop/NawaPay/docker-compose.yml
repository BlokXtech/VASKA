services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4100
      MONGO_URI: mongodb://mongo:27017/nawapay
      SQL_URI: postgres://nawapay:nawapay@postgres:5432/nawapay
      JWT_SECRET: change-me-in-production
      ELECTRICITY_PROVIDER_API_KEY: mock-electricity-key
      MTC_PROVIDER_API_KEY: mock-mtc-key
      TELECOM_PROVIDER_API_KEY: mock-telecom-key
      CASTLEBET_PROVIDER_API_KEY: mock-castlebet-key
      JSB_PROVIDER_API_KEY: mock-jsb-key
    ports:
      - "4100:4100"
    depends_on:
      - mongo
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4100
    ports:
      - "5173:5173"
    depends_on:
      - api

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nawapay
      POSTGRES_PASSWORD: nawapay
      POSTGRES_DB: nawapay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mongo-data:
  postgres-data:
